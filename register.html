<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>MHM | إنشاء حساب</title>

<link rel="stylesheet"
href="assets/css/main.css">

<link rel="stylesheet"
href="assets/css/register.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body class="register-page">

<div class="register-box">

<div class="logo">

<img
src="assets/images/logo.png"
alt="MHM">

<h1>MHM</h1>

<p>

إنشاء حساب جديد

</p>

</div>

<form
id="registerForm">

<div class="register-grid">

<div class="form-group">

<label>

الاسم بالكامل

</label>

<input
type="text"
id="fullName"
placeholder="اكتب اسمك">

</div>

<div class="form-group">

<label>

اسم المستخدم

</label>

<input
type="text"
id="username"
placeholder="@username">

</div>

<div class="form-group">

<label>

رقم الهاتف

</label>

<input
type="tel"
id="phone"
placeholder="+20">

</div>

<div class="form-group">

<label>

البريد الإلكتروني

</label>

<input
type="email"
id="email">

</div>

<div class="form-group">

<label>

كلمة المرور

</label>

<input
type="password"
id="password">

</div>

<div class="form-group">

<label>

الدولة

</label>

<input
type="text"
id="country">

</div>

<div class="form-group">

<label>

المدينة

</label>

<input
type="text"
id="city">

</div>

<div class="form-group">

<label>

نوع الحساب

</label>

<select
id="accountType">

<option value="user">

مستخدم

</option>

<option value="company">

شركة

</option>

<option value="factory">

مصنع

</option>

<option value="store">

متجر

</option>

</select>

</div>
