<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>MHM | إنشاء حساب</title>

<link rel="stylesheet"
href="assets/css/main.css">

<link rel="stylesheet"
href="assets/css/register.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body class="register-page">

<div class="register-box">

<div class="logo">

<img
src="assets/images/logo.png"
alt="MHM">

<h1>MHM</h1>

<p>

إنشاء حساب جديد

</p>

</div>

<form
id="registerForm">

<div class="register-grid">

<div class="form-group">

<label>

الاسم بالكامل

</label>

<input
type="text"
id="fullName"
placeholder="اكتب اسمك">

</div>

<div class="form-group">

<label>

اسم المستخدم

</label>

<input
type="text"
id="username"
placeholder="@username">

</div>

<div class="form-group">

<label>

رقم الهاتف

</label>

<input
type="tel"
id="phone"
placeholder="+20">

</div>

<div class="form-group">

<label>

البريد الإلكتروني

</label>

<input
type="email"
id="email">

</div>

<div class="form-group">

<label>

كلمة المرور

</label>

<input
type="password"
id="password">

</div>

<div class="form-group">

<label>

الدولة

</label>

<input
type="text"
id="country">

</div>

<div class="form-group">

<label>

المدينة

</label>

<input
type="text"
id="city">

</div>

<div class="form-group">

<label>

نوع الحساب

</label>

<select
id="accountType">

<option value="user">

مستخدم

</option>

<option value="company">

شركة

</option>

<option value="factory">

مصنع

</option>

<option value="store">

متجر

</option>

</select>

</div>
<!-- ====== رفع الصورة الشخصية ====== -->

<div class="form-group full">

<label>

الصورة الشخصية

</label>

<div class="upload-box">

<input
type="file"
id="avatar"
accept="image/*"
hidden>

<label
for="avatar">

<i class="fa-solid fa-cloud-arrow-up"></i>

<p>

اختر صورة شخصية

</p>

</label>

<div class="upload-preview">

<img
id="avatarPreview"
src="">

</div>

</div>

</div>

<!-- ====== البطاقة ====== -->

<div class="form-group full">

<label>

صورة البطاقة

</label>

<div class="upload-box">

<input
type="file"
id="nationalId"
accept="image/*"
hidden>

<label
for="nationalId">

<i class="fa-solid fa-id-card"></i>

<p>

رفع صورة البطاقة

</p>

</label>

</div>

</div>

<!-- ====== السجل التجاري ====== -->

<div class="form-group full">

<label>

السجل التجاري (اختياري)

</label>

<div class="upload-box">

<input
type="file"
id="companyFile"
accept="image/*,.pdf"
hidden>

<label
for="companyFile">

<i class="fa-solid fa-building"></i>

<p>

رفع السجل التجاري

</p>

</label>

</div>

</div>

<!-- ====== الشروط ====== -->

<div class="form-group full">

<label>

<input
type="checkbox"
id="agree">

أوافق على الشروط والأحكام وسياسة الخصوصية.

</label>

</div>

</div>

<!-- ====== أزرار ====== -->

<div class="register-actions">

<button
type="submit"
class="btn-register">

<i class="fa-solid fa-user-plus"></i>

إنشاء الحساب

</button>

<button
type="reset"
class="btn-reset">

إعادة تعيين

</button>

</div>

<div class="note">

<strong>تنبيه</strong>

لن يتم تفعيل الحساب مباشرة.

سيتم إرسال طلبك إلى إدارة MHM للمراجعة.

بعد الموافقة سيتم إنشاء:

<ul>

<li>✔ ID يبدأ بـ 54</li>

<li>✔ Access Code يبدأ بـ CC</li>

<li>✔ إشعار بالموافقة</li>

</ul>

</div>

</form>

</div>

<script type="module"
src="assets/js/register.js">

</script>

</body>

</html>
