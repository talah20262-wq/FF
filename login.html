<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>MHM | تسجيل الدخول</title>

<link rel="stylesheet" href="assets/css/main.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<style>

body{

background:#050816;

display:flex;

justify-content:center;

align-items:center;

height:100vh;

overflow:hidden;

}

body::before{

content:"";

position:absolute;

width:220%;

height:220%;

background:

radial-gradient(circle,#00c6ff22,transparent 35%),

radial-gradient(circle,#7f5af022,transparent 40%);

animation:rotateBG 25s linear infinite;

}

@keyframes rotateBG{

100%{

transform:rotate(360deg);

}

}

.login-box{

position:relative;

z-index:5;

width:450px;

padding:35px;

background:rgba(255,255,255,.08);

backdrop-filter:blur(20px);

border-radius:20px;

box-shadow:0 20px 50px rgba(0,0,0,.35);

}

.login-box h1{

text-align:center;

margin-bottom:10px;

}

.login-box p{

text-align:center;

margin-bottom:30px;

color:#ddd;

}

.input{

margin-bottom:18px;

}

.input label{

display:block;

margin-bottom:8px;

}

.input input{

width:100%;

padding:15px;

border:none;

border-radius:12px;

background:rgba(255,255,255,.08);

color:white;

}

button{

width:100%;

padding:16px;

border:none;

border-radius:14px;

background:#00c6ff;

font-size:18px;

font-weight:bold;

cursor:pointer;

margin-top:15px;

}

.links{

margin-top:20px;

display:flex;

justify-content:space-between;

font-size:14px;

}

.links a{

color:#00c6ff;

text-decoration:none;

}

</style>

</head>

<body>

<div class="login-box">

<h1>MHM</h1>

<p>

تسجيل الدخول

</p>

<form id="loginForm">

<div class="input">

<label>

البريد الإلكتروني

</label>

<input

type="email"

id="email"

required>

</div>

<div class="input">

<label>

كلمة المرور

</label>

<input

type="password"

id="password"

required>

</div>

<button

type="submit">

تسجيل الدخول

</button>

</form>

<div class="links">

<a href="register.html">

إنشاء حساب

</a>

<a href="#">

نسيت كلمة المرور؟

</a>

</div>

</div>

<script type="module">

import {initializeApp}

from

"https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";

import {

getAuth,

signInWithEmailAndPassword

}

from

"https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

import {

getDatabase,

ref,

get

}

from

"https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";

const firebaseConfig={

apiKey:"YOUR_API_KEY",

authDomain:"cssc-4c83c.firebaseapp.com",

databaseURL:"https://cssc-4c83c-default-rtdb.firebaseio.com",

projectId:"cssc-4c83c",

storageBucket:"cssc-4c83c.appspot.com",

messagingSenderId:"YOUR_SENDER_ID",

appId:"YOUR_APP_ID"

};

const app=initializeApp(firebaseConfig);

const auth=getAuth(app);

const db=getDatabase(app);

document

.getElementById("loginForm")

.addEventListener("submit",

async(e)=>{

e.preventDefault();

const email=document.getElementById("email").value;

const password=document.getElementById("password").value;

try{

const user=

await signInWithEmailAndPassword(

auth,

email,

password

);

const uid=user.user.uid;

/* التحقق من دور المستخدم */

const roleSnap=

await get(

ref(db,"roles/"+uid)

);

if(roleSnap.exists()

&&

roleSnap.val().role==="owner"){

location.href="owner/dashboard.html";

}else{

location.href="home.html";

}

}catch(error){

alert(error.message);

}

});

</script>

</body>

</html>
